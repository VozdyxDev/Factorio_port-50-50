apply plugin: 'com.android.application'

// Optional local build on an ARM64 phone. This directory must contain the full
// arm64-v8a library set; normal CI still builds native libraries from source.
def prebuiltNativeDir = project.findProperty('factorioPrebuiltNativeDir')

// One version number for everything (CHANGES, diagnostics, "App version code" in the reports).
def appVersion = 48

// Release signing: a keystore from the CI secrets / gradle properties if it is given,
// otherwise the same debug-fixed.keystore as before (same signature, so updates keep working).
def releaseStoreFile = project.findProperty('factorioStoreFile') ?: System.getenv('FACTORIO_STORE_FILE')
def releaseStorePassword = project.findProperty('factorioStorePassword') ?: System.getenv('FACTORIO_STORE_PASSWORD')
def releaseKeyAlias = project.findProperty('factorioKeyAlias') ?: System.getenv('FACTORIO_KEY_ALIAS')
def releaseKeyPassword = project.findProperty('factorioKeyPassword') ?: System.getenv('FACTORIO_KEY_PASSWORD')

android {
    compileSdk 34
    if (project.hasProperty('factorioBuildTools')) buildToolsVersion project.property('factorioBuildTools')

    defaultConfig {
        applicationId 'com.factorio'
        minSdkVersion 26
        // 28 on purpose: from targetSdk 29 Android forbids executing binaries from the app data folder (W^X),
        // and the whole rootfs (glibc loader, game binary) is started from there.
        targetSdkVersion 28
        versionCode appVersion
        versionName "r${appVersion}"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug-fixed.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (releaseStoreFile) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
            else {
                storeFile file('debug-fixed.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        // Not debuggable: ART compiles the Java X server / input code fully, the debug build runs it slower.
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    packagingOptions {
        jniLibs {
            // libc++_shared.so is shipped prebuilt (PulseAudio libraries need it) and is also produced by the NDK.
            pickFirsts.add('**/libc++_shared.so')
        }
    }

    lintOptions {
        checkReleaseBuilds false
    }

    if (prebuiltNativeDir) {
        sourceSets.main.jniLibs.srcDirs = [prebuiltNativeDir]
    } else {
        ndkVersion '24.0.8215888'
        externalNativeBuild {
            cmake {
                version '3.22.1'
                path 'src/main/cpp/CMakeLists.txt'
            }
        }
        if (project.hasProperty('factorioCcache')) {
            // CI: ccache keeps the compiled native objects between runs
            defaultConfig {
                externalNativeBuild {
                    cmake {
                        arguments '-DCMAKE_C_COMPILER_LAUNCHER=ccache', '-DCMAKE_CXX_COMPILER_LAUNCHER=ccache'
                    }
                }
            }
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.4.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'com.github.luben:zstd-jni:1.5.2-3@aar'
    implementation 'org.tukaani:xz:1.9'
    implementation 'org.apache.commons:commons-compress:1.21' // 1.26 pulls commons-lang3 3.14, which crashes R8 of AGP 7.2
}
